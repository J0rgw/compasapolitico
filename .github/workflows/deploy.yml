# Valida los datos y publica la web en GitHub Pages en cada push a main.
# Activación (una sola vez): Settings › Pages › Build and deployment › Source: «GitHub Actions».
name: Validar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar baterías de datos
        run: |
          node tools/test-registry.js
          node tools/validate.js

      - name: Construir versión autocontenida
        run: python3 tools/build.py

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r index.html styles.css script.js data METODOLOGIA.md README.md _site/
          cp dist/compas-politico.html _site/compas-politico.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
